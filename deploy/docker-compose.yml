# Astro library manager on the NAS.
#
# Edit the three host paths under `volumes` and the token, then:
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# The catalog lives in a named volume on local disk, not on a network share.
services:
  astro:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Name=path pairs. The name is the Location shown for files under that path;
      # use the old volume name so Locations match a catalog migrated from the Mac.
      ASTRO_LIBRARY_ROOTS: "Multimedia=/library"
      ASTRO_PROJECTS_ROOT: "/library/projects"
      ASTRO_BACKUP_DIR: "/backup"
      ASTRO_BACKUP_KEEP: "14"
      ASTRO_SCHEDULER: "1"
      ASTRO_CLI_TOKEN: "change-me"
    volumes:
      - astro-data:/data
      # The library share. Read-write: Source pulls write into mirror folders under it.
      - /share/Multimedia/AstroPhotos:/library
      # Catalog snapshots.
      - /share/Multimedia/AstroPhotos/_catalog_backup:/backup
      # Device shares as the NAS mounts them. Read-only: pulls never write to a device.
      - /share:/devices:ro

volumes:
  astro-data:
